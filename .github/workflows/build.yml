name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: dnf -y install gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel dnf5 rpm rpm-build tar
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          KCONTROLC_SMOKE_TEST: "1"
        run: ./build/k-controlc
      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh
      - name: Validate RPM spec
        run: rpmspec -P packaging/k-controlc.spec >/dev/null
      - name: Stage install
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          tar -C stage -czf k-controlc-stage.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: k-controlc-${{ github.sha }}
          path: k-controlc-stage.tar.gz
          if-no-files-found: error
