name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          dnf -y install gcc-c++ cmake ninja-build git gzip gh
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          dnf5 dnf5-plugins rpm rpm-build tar

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KCC_SMOKE_TEST: "1"
        run: ./build/kcc

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Validate RPM spec
        run: |
          rpmspec -P packaging/kcc.spec >/dev/null
          test "$(rpmspec -q --qf '%{NAME}\n' packaging/kcc.spec | head -n1)" = "kcc"

      - name: Stage install
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/kcc
          test -f stage/usr/share/applications/kcc.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/kcc.svg
          tar -C stage -czf kcc-stage.tar.gz .

      - name: Build RPM
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          (
            set -euxo pipefail
            test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
            mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='./build' \
              --exclude='./stage' \
              --exclude='./artifacts' \
              --exclude='./kcc-stage.tar.gz' \
              --transform='s,^\./,kcc-0.4.0/,' \
              -czf "$HOME/rpmbuild/SOURCES/kcc-0.4.0.tar.gz" .
            cp "$GITHUB_WORKSPACE/packaging/kcc.spec" "$HOME/rpmbuild/SPECS/kcc.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/kcc.spec"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/rpm" "$GITHUB_WORKSPACE/artifacts/srpm" "$GITHUB_WORKSPACE/artifacts/stage"
            cp "$HOME"/rpmbuild/RPMS/*/kcc-*.rpm "$GITHUB_WORKSPACE/artifacts/rpm/"
            cp "$HOME"/rpmbuild/SRPMS/kcc-*.src.rpm "$GITHUB_WORKSPACE/artifacts/srpm/"
            cp "$GITHUB_WORKSPACE/kcc-stage.tar.gz" "$GITHUB_WORKSPACE/artifacts/stage/"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/rpmbuild.log"

      - name: Verify replacement of legacy k-controlc RPM
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$HOME/rpmbuild/SPECS/k-controlc-legacy.spec" <<'EOF'
          Name: k-controlc
          Version: 0.3.0
          Release: 1%{?dist}
          Summary: Legacy K-ControlC transition fixture
          License: MIT
          BuildArch: noarch

          %description
          Minimal legacy package used only to verify KCC RPM replacement semantics.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_datadir}/applications
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/scalable/apps
          mkdir -p %{buildroot}%{_datadir}/polkit-1/actions
          printf '#!/bin/sh\nexit 0\n' > %{buildroot}%{_bindir}/k-controlc
          chmod 0755 %{buildroot}%{_bindir}/k-controlc
          printf '[Desktop Entry]\nName=K-ControlC Legacy\nExec=k-controlc\nType=Application\n' > %{buildroot}%{_datadir}/applications/k-controlc.desktop
          printf '<svg xmlns="http://www.w3.org/2000/svg"/>\n' > %{buildroot}%{_datadir}/icons/hicolor/scalable/apps/k-controlc.svg
          printf '<policyconfig/>\n' > %{buildroot}%{_datadir}/polkit-1/actions/org.kcontrolc.controlcenter.policy

          %files
          %{_bindir}/k-controlc
          %{_datadir}/applications/k-controlc.desktop
          %{_datadir}/icons/hicolor/scalable/apps/k-controlc.svg
          %{_datadir}/polkit-1/actions/org.kcontrolc.controlcenter.policy
          EOF
          rpmbuild -bb "$HOME/rpmbuild/SPECS/k-controlc-legacy.spec"
          dnf -y install "$HOME"/rpmbuild/RPMS/noarch/k-controlc-0.3.0-1*.rpm
          rpm -q k-controlc
          test -x /usr/bin/k-controlc
          test -f /usr/share/applications/k-controlc.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/k-controlc.svg

          dnf -y install artifacts/rpm/kcc-*.rpm
          rpm -q kcc
          ! rpm -q k-controlc
          test ! -e /usr/bin/k-controlc
          test ! -e /usr/share/applications/k-controlc.desktop
          test ! -e /usr/share/icons/hicolor/scalable/apps/k-controlc.svg
          test "$(rpm -qf /usr/share/polkit-1/actions/org.kcontrolc.controlcenter.policy)" = "$(rpm -q kcc)"

      - name: Install built RPM and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KCC_SMOKE_TEST: "1"
        run: |
          dnf -y reinstall artifacts/rpm/kcc-*.rpm
          rpm -q kcc
          test "$(rpm -q --provides kcc | grep -c '^k-controlc = ')" -ge 1
          /usr/bin/kcc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcc-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

      - name: Publish tagged RPM release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "KCC $tag" \
              --notes "KCC RPM built and smoke-tested by CI from $GITHUB_SHA."
          fi
          gh release upload "$tag" artifacts/rpm/kcc-*.rpm --clobber
