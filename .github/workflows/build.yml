name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          dnf -y install gcc-c++ cmake ninja-build git gzip
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          dnf5 rpm rpm-build tar

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KRISCC_SMOKE_TEST: "1"
        run: ./build/krisCC

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Validate RPM spec
        run: |
          rpmspec -P packaging/krisCC.spec >/dev/null
          test "$(rpmspec -q --qf '%{NAME}\n' packaging/krisCC.spec | head -n1)" = "krisCC"
          test "$(rpmspec -q --qf '%{VERSION}-%{RELEASE}\n' packaging/krisCC.spec | head -n1)" = "0.4.0-10.fc44"
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Provides:[[:space:]]+kcc([[:space:]=]|$)'
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Obsoletes:[[:space:]]+kcc([[:space:]<=>]|$)'
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Requires:[[:space:]]+dnf5-plugins([[:space:]]|$)'

      - name: Stage install
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/krisCC
          test -f stage/usr/share/applications/krisCC.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/krisCC.svg
          test -f stage/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy
          test -f stage/usr/share/metainfo/org.kriscc.KrisCC.metainfo.xml
          tar -C stage -czf krisCC-stage.tar.gz .

      - name: Build RPM
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          (
            set -euxo pipefail
            test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
            mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='./build' \
              --exclude='./stage' \
              --exclude='./artifacts' \
              --exclude='./krisCC-stage.tar.gz' \
              --transform='s,^\./,krisCC-0.4.0/,' \
              -czf "$HOME/rpmbuild/SOURCES/krisCC-0.4.0.tar.gz" .
            cp "$GITHUB_WORKSPACE/packaging/krisCC.spec" "$HOME/rpmbuild/SPECS/krisCC.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/krisCC.spec"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/rpm" "$GITHUB_WORKSPACE/artifacts/srpm" "$GITHUB_WORKSPACE/artifacts/stage"
            cp "$HOME"/rpmbuild/RPMS/*/krisCC-*.rpm "$GITHUB_WORKSPACE/artifacts/rpm/"
            cp "$HOME"/rpmbuild/SRPMS/krisCC-*.src.rpm "$GITHUB_WORKSPACE/artifacts/srpm/"
            cp "$GITHUB_WORKSPACE/krisCC-stage.tar.gz" "$GITHUB_WORKSPACE/artifacts/stage/"
            cd "$GITHUB_WORKSPACE/artifacts/rpm"
            sha256sum krisCC-*.rpm > SHA256SUMS
            grep -Eq '^[0-9a-f]{64}[[:space:]]+krisCC-0[.]4[.]0-10.*[.]rpm$' SHA256SUMS
          ) 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/rpmbuild.log"

      - name: Verify Fedora kcc coexistence and legacy replacement
        shell: bash
        run: |
          set -euxo pipefail

          # Fedora already owns the generic kcc name and /usr/bin/kcc. krisCC
          # must install next to it without Provides/Obsoletes or file conflicts.
          dnf -y install kcc
          rpm -q kcc
          test -x /usr/bin/kcc

          cat > "$HOME/rpmbuild/SPECS/k-controlc-legacy.spec" <<'EOF'
          Name: k-controlc
          Version: 0.3.0
          Release: 1%{?dist}
          Summary: Legacy K-ControlC transition fixture
          License: MIT
          BuildArch: noarch

          %description
          Minimal legacy package used only to verify krisCC RPM replacement semantics.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_datadir}/applications
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/scalable/apps
          mkdir -p %{buildroot}%{_datadir}/polkit-1/actions
          printf '#!/bin/sh\nexit 0\n' > %{buildroot}%{_bindir}/k-controlc
          chmod 0755 %{buildroot}%{_bindir}/k-controlc
          printf '[Desktop Entry]\nName=K-ControlC Legacy\nExec=k-controlc\nType=Application\n' > %{buildroot}%{_datadir}/applications/k-controlc.desktop
          printf '<svg xmlns="http://www.w3.org/2000/svg"/>\n' > %{buildroot}%{_datadir}/icons/hicolor/scalable/apps/k-controlc.svg
          printf '<policyconfig/>\n' > %{buildroot}%{_datadir}/polkit-1/actions/org.kcontrolc.controlcenter.policy

          %files
          %{_bindir}/k-controlc
          %{_datadir}/applications/k-controlc.desktop
          %{_datadir}/icons/hicolor/scalable/apps/k-controlc.svg
          %{_datadir}/polkit-1/actions/org.kcontrolc.controlcenter.policy
          EOF
          rpmbuild -bb "$HOME/rpmbuild/SPECS/k-controlc-legacy.spec"
          dnf -y install "$HOME"/rpmbuild/RPMS/noarch/k-controlc-0.3.0-1*.rpm
          rpm -q k-controlc

          dnf -y install artifacts/rpm/krisCC-*.rpm
          rpm -q krisCC
          rpm -q kcc
          ! rpm -q k-controlc
          test -x /usr/bin/kcc
          test -x /usr/bin/krisCC
          test ! -e /usr/bin/k-controlc
          test ! -e /usr/share/applications/k-controlc.desktop
          test ! -e /usr/share/icons/hicolor/scalable/apps/k-controlc.svg
          test ! -e /usr/share/polkit-1/actions/org.kcontrolc.controlcenter.policy
          test "$(rpm -qf /usr/share/polkit-1/actions/org.kriscc.controlcenter.policy)" = "$(rpm -q krisCC)"

      - name: Install built RPM and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KRISCC_SMOKE_TEST: "1"
        run: |
          dnf -y reinstall artifacts/rpm/krisCC-*.rpm
          rpm -q krisCC
          rpm -q kcc
          test "$(rpm -q --provides krisCC | grep -c '^k-controlc = ')" -ge 1
          /usr/bin/krisCC

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-fedora
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts

      - name: Verify RPM checksum artifact
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/rpm
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name 'krisCC-0.4.0-10*.rpm' | wc -l)" -ge 1

      - name: Publish tagged RPM release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "krisCC $tag" \
              --notes "krisCC RPM built and smoke-tested by CI from $GITHUB_SHA. SHA256SUMS identifies the exact tested RPM."
          fi
          gh release upload "$tag" artifacts/rpm/krisCC-*.rpm artifacts/rpm/SHA256SUMS --clobber
