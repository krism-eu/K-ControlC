name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          dnf -y install gcc-c++ cmake ninja-build git gzip
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          dnf5 dnf5-plugins rpm rpm-build tar

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KCONTROLC_SMOKE_TEST: "1"
        run: ./build/k-controlc

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Validate RPM spec
        run: rpmspec -P packaging/k-controlc.spec >/dev/null

      - name: Stage install
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          tar -C stage -czf k-controlc-stage.tar.gz .

      - name: Build RPM
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          (
            set -euxo pipefail
            test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
            mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='./build' \
              --exclude='./stage' \
              --exclude='./artifacts' \
              --exclude='./k-controlc-stage.tar.gz' \
              --transform='s,^\./,k-controlc-0.4.0/,' \
              -czf "$HOME/rpmbuild/SOURCES/k-controlc-0.4.0.tar.gz" .
            cp "$GITHUB_WORKSPACE/packaging/k-controlc.spec" "$HOME/rpmbuild/SPECS/"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/k-controlc.spec"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/rpm" "$GITHUB_WORKSPACE/artifacts/srpm" "$GITHUB_WORKSPACE/artifacts/stage"
            cp "$HOME"/rpmbuild/RPMS/*/k-controlc-*.rpm "$GITHUB_WORKSPACE/artifacts/rpm/"
            cp "$HOME"/rpmbuild/SRPMS/k-controlc-*.src.rpm "$GITHUB_WORKSPACE/artifacts/srpm/"
            cp "$GITHUB_WORKSPACE/k-controlc-stage.tar.gz" "$GITHUB_WORKSPACE/artifacts/stage/"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/rpmbuild.log"

      - name: Install built RPM and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KCONTROLC_SMOKE_TEST: "1"
        run: |
          dnf -y install artifacts/rpm/k-controlc-*.rpm
          /usr/bin/k-controlc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-controlc-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
