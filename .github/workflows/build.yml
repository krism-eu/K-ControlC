name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    outputs:
      tag: ${{ steps.rpm_identity.outputs.tag }}
      rpm: ${{ steps.rpm_identity.outputs.rpm }}
      version: ${{ steps.rpm_identity.outputs.version }}
      release: ${{ steps.rpm_identity.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: >-
          dnf -y install gcc-c++ cmake ninja-build git gzip
          qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel
          dnf5 rpm rpm-build tar

      - name: Resolve RPM identity
        id: rpm_identity
        shell: bash
        run: |
          set -euo pipefail
          name="$(rpmspec -q --qf '%{NAME}\n' packaging/krisCC.spec | head -n1)"
          version="$(rpmspec -q --qf '%{VERSION}\n' packaging/krisCC.spec | head -n1)"
          release="$(rpmspec -q --qf '%{RELEASE}\n' packaging/krisCC.spec | head -n1)"
          test "$name" = "krisCC"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$release" =~ ^([0-9]+)\.fc44$ ]]
          release_number="${BASH_REMATCH[1]}"
          rpm="krisCC-${version}-${release}.x86_64.rpm"
          tag="v${version}-${release_number}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "rpm=$rpm" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'Component identity: %s / %s\n' "$tag" "$rpm"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: QML runtime smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
          KRISCC_SMOKE_TEST: "1"
        run: ./build/krisCC

      - name: Read-only integration checks
        run: ./tests/e2e-readonly.sh

      - name: Validate RPM spec
        run: |
          rpmspec -P packaging/krisCC.spec >/dev/null
          test "$(rpmspec -q --qf '%{NAME}\n' packaging/krisCC.spec | head -n1)" = "krisCC"
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Provides:[[:space:]]+(kcc|k-controlc)([[:space:]=]|$)'
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Obsoletes:[[:space:]]+(kcc|k-controlc)([[:space:]<=>]|$)'
          ! rpmspec -P packaging/krisCC.spec | grep -Eq '^Requires:[[:space:]]+dnf5-plugins([[:space:]]|$)'

      - name: Stage install
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          test -x stage/usr/bin/krisCC
          test -f stage/usr/share/applications/krisCC.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/krisCC.svg
          test -f stage/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy
          test -f stage/usr/share/metainfo/org.kriscc.KrisCC.metainfo.xml
          tar -C stage -czf krisCC-stage.tar.gz .

      - name: Build RPM
        shell: bash
        env:
          VERSION: ${{ steps.rpm_identity.outputs.version }}
          RPM_NAME: ${{ steps.rpm_identity.outputs.rpm }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          (
            set -euxo pipefail
            test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
            mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            tar -C "$GITHUB_WORKSPACE" \
              --exclude='./.git' \
              --exclude='./build' \
              --exclude='./stage' \
              --exclude='./artifacts' \
              --exclude='./krisCC-stage.tar.gz' \
              --transform="s,^\\./,krisCC-${VERSION}/," \
              -czf "$HOME/rpmbuild/SOURCES/krisCC-${VERSION}.tar.gz" .
            cp "$GITHUB_WORKSPACE/packaging/krisCC.spec" "$HOME/rpmbuild/SPECS/krisCC.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/krisCC.spec"
            mkdir -p "$GITHUB_WORKSPACE/artifacts/rpm" "$GITHUB_WORKSPACE/artifacts/srpm" "$GITHUB_WORKSPACE/artifacts/stage"
            cp "$HOME"/rpmbuild/RPMS/*/krisCC-*.rpm "$GITHUB_WORKSPACE/artifacts/rpm/"
            cp "$HOME"/rpmbuild/SRPMS/krisCC-*.src.rpm "$GITHUB_WORKSPACE/artifacts/srpm/"
            cp "$GITHUB_WORKSPACE/krisCC-stage.tar.gz" "$GITHUB_WORKSPACE/artifacts/stage/"
            cd "$GITHUB_WORKSPACE/artifacts/rpm"
            test -f "$RPM_NAME"
            sha256sum "$RPM_NAME" > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 1
            grep -Eq "^[0-9a-f]{64}[[:space:]]+${RPM_NAME//./[.]}$" SHA256SUMS
          ) 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/rpmbuild.log"

      - name: Inspect built RPM artifact
        shell: bash
        env:
          RPM_NAME: ${{ steps.rpm_identity.outputs.rpm }}
          VERSION: ${{ steps.rpm_identity.outputs.version }}
          RELEASE: ${{ steps.rpm_identity.outputs.release }}
        run: |
          set -euxo pipefail
          rpm_file="artifacts/rpm/$RPM_NAME"
          test -f "$rpm_file"
          test "$(rpm -qp --qf '%{NAME}\n' "$rpm_file")" = "krisCC"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$rpm_file")" = "$VERSION-$RELEASE"
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/bin/krisCC'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/applications/krisCC.desktop'
          rpm -qpl "$rpm_file" | grep -Fxq '/usr/share/polkit-1/actions/org.kriscc.controlcenter.policy'
          rpm -qpR "$rpm_file" | grep -Eq '^polkit([[:space:]<=>]|$)'
          ! rpm -qp --provides "$rpm_file" | grep -Eq '^(kcc|k-controlc)([[:space:]=]|$)'
          (cd artifacts/rpm && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-fedora
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: krisCC-${{ github.sha }}
          path: artifacts

      - name: Verify component artifact
        env:
          RPM: ${{ needs.build-fedora.outputs.rpm }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/rpm
          test -f "$RPM"
          test "$(wc -l < SHA256SUMS)" -eq 1
          sha256sum -c SHA256SUMS
          checksum="$(awk -v f="$RPM" '$2 == f || $2 == "./" f {print $1}' SHA256SUMS)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]

      - name: Publish immutable component release when needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-fedora.outputs.tag }}
          RPM: ${{ needs.build-fedora.outputs.rpm }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            tag_sha="$(git rev-parse "$TAG^{commit}")"
            mkdir -p /tmp/kriscc-existing
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p "$RPM" -p SHA256SUMS -D /tmp/kriscc-existing
            (cd /tmp/kriscc-existing && sha256sum -c SHA256SUMS)
            if git diff --quiet "$tag_sha" "$GITHUB_SHA" -- \
                CMakeLists.txt src qml data packaging/krisCC.spec; then
              echo "Release $TAG already represents the current product sources; nothing to republish."
              exit 0
            fi
            echo "Product sources changed after immutable release $TAG. Bump Version or Release in packaging/krisCC.spec before merging." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "krisCC $TAG" \
            --notes "Validated krisCC component built from $GITHUB_SHA. KrisOS performs final runtime integration before adopting this release." \
            "artifacts/rpm/$RPM" \
            artifacts/rpm/SHA256SUMS
